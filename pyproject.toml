[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yoga-coach"
version = "0.1.0"
description = "用摄像头实时检查瑜伽体式并给出纠正建议"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "mediapipe>=1.0,<2.0",
    "opencv-python>=4.8",
    "numpy>=1.24",
    "pillow>=10.0",
]

[project.optional-dependencies]
speech = ["pyttsx3>=2.90"]
dev = ["pytest>=7.0"]

[project.scripts]
yoga-coach = "yoga_coach.cli:main"

[tool.setuptools]
packages = ["yoga_coach"]

[tool.pytest.ini_options]
testpaths = ["tests"]
