name: CI

on:
  push:
    branches: [Yoga, main]
  pull_request:

# A new push supersedes whatever was still running for the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 测试 · Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      # No MediaPipe here on purpose.  Neither tool's judgement layer imports
      # it -- yoga_coach keeps it out of the rules, and the yoga_grid modules
      # the tests touch (poses, reference, landmarks, cluster, score, select,
      # naming) need only numpy -- so this job stays a fast gate on every
      # push.  The smoke job below covers the MediaPipe side for both.
      - name: 安装依赖
        run: pip install -r requirements-dev.txt

      # Both packages.  yoga_grid arrived on main with no CI at all, so this
      # is the first automated check it has ever had.
      - name: 静态检查
        run: python -m pyflakes yoga_coach yoga_grid tests tools

      - name: 单元测试
        run: python -m pytest tests -q

      # Redundant with tests/test_readme.py, but it fails with a diff and a
      # copy-pasteable fix instead of a pytest traceback.  Covers the coach's
      # document only; the repo README is yoga_grid's and is hand-written.
      - name: 教练文档是否与代码同步
        run: python tools/update_readme.py --check

  smoke:
    name: 真实 MediaPipe 冒烟测试
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      # MediaPipe's native library links against the system OpenGL/EGL stack,
      # which the runner image does not ship.
      - name: 安装系统图形库
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libgles2 libgl1 libglib2.0-0

      - name: 安装运行时依赖
        run: pip install -r requirements.txt

      - name: 缓存姿态模型
        uses: actions/cache@v4
        with:
          path: ~/.cache/yoga_coach/models
          key: pose-models-lite-v1

      # Catches what the unit tests cannot: a renamed MediaPipe API, a wheel
      # that will not load, or a moved model URL.
      - name: 端到端冒烟测试
        run: python tools/smoke_test.py

      # yoga_grid's cv2-importing modules (cli, extract, grid, compare, faces,
      # compat) are invisible to the light job, which never installs OpenCV.
      # Loading both CLIs is the cheapest check that they still import.
      - name: 命令行可用
        run: |
          python -m yoga_coach --list-poses
          python -m yoga_coach --help > /dev/null
          python -m yoga_grid --list-poses
          python -m yoga_grid --help > /dev/null
